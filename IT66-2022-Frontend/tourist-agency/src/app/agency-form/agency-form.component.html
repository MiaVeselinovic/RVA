<div class="dialog-container">

  <div class="dialog-header">

    <div class="dialog-icon">
      <mat-icon>
        {{ flag == 3 ? 'delete_outline' : 'apartment' }}
      </mat-icon>
    </div>

    <div>
      <span class="dialog-label">ART OF TRAVEL</span>

      <h2>
        <span *ngIf="flag == 1">Nova agencija</span>
        <span *ngIf="flag == 2">Izmena agencije</span>
        <span *ngIf="flag == 3">Brisanje agencije</span>
      </h2>

      <p *ngIf="flag == 2">
        {{ data.name }}
      </p>

      <p *ngIf="flag == 3">
        Da li ste sigurni da želite da obrišete ovu agenciju?
      </p>
    </div>

  </div>


  <form
    class="dialog-form"
    #formControl="ngForm"
  >

    <mat-form-field appearance="outline">
      <mat-label>Naziv agencije</mat-label>

      <mat-icon matPrefix>business</mat-icon>

      <input
        matInput
        name="Name"
        [disabled]="flag == 3"
        [(ngModel)]="data.name"
        required
      />
    </mat-form-field>


    <mat-form-field appearance="outline">
      <mat-label>Adresa</mat-label>

      <mat-icon matPrefix>location_on</mat-icon>

      <input
        matInput
        name="Address"
        [disabled]="flag == 3"
        [(ngModel)]="data.address"
        required
      />
    </mat-form-field>


    <mat-form-field appearance="outline">
      <mat-label>Kontakt</mat-label>

      <mat-icon matPrefix>phone</mat-icon>

      <input
        matInput
        name="Contact"
        [disabled]="flag == 3"
        [(ngModel)]="data.contact"
        required
      />
    </mat-form-field>

  </form>


  <div class="dialog-actions">

    <button
      mat-button
      class="cancel-button"
      (click)="cancel()"
    >
      Otkaži
    </button>


    <button
      mat-raised-button
      class="save-button"
      *ngIf="flag == 1"
      type="submit"
      mat-dialog-close="1"
      [disabled]="!formControl.valid"
      (click)="add()"
    >
      <mat-icon>save</mat-icon>
      Sačuvaj
    </button>


    <button
      mat-raised-button
      class="save-button"
      *ngIf="flag == 2"
      type="submit"
      mat-dialog-close="1"
      [disabled]="!formControl.valid"
      (click)="update()"
    >
      <mat-icon>check</mat-icon>
      Sačuvaj izmene
    </button>


    <button
      mat-raised-button
      class="delete-confirm-button"
      *ngIf="flag == 3"
      mat-dialog-close="1"
      (click)="delete()"
    >
      <mat-icon>delete_outline</mat-icon>
      Obrisi
    </button>

  </div>

</div>
