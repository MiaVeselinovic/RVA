<mat-toolbar color="primary">
  <span class="title-center">Arrangements</span>
</mat-toolbar>

<div class="container mat-elavation-z8">
  <table mat-table matSort [dataSource]="dataSource" class="mat-cell">
    <!-- ID -->
    <ng-container matColumnDef="id">
      <th mat-header-cell mat-sort-header *matHeaderCellDef>ID</th>
      <td mat-cell *matCellDef="let row">{{ row.id }}</td>
    </ng-container>

    <!-- Ukupna cena -->
    <ng-container matColumnDef="total_cost">
      <th mat-header-cell mat-sort-header *matHeaderCellDef>Total cost</th>
      <td mat-cell *matCellDef="let row">{{ row.total_cost }}</td>
    </ng-container>

    <!-- Plaćeno -->
    <ng-container matColumnDef="payed">
      <th mat-header-cell mat-sort-header *matHeaderCellDef>Payed</th>
      <td mat-cell *matCellDef="let row">{{ row.payed ? 'Da' : 'Ne' }}</td>
    </ng-container>

    <!-- Datum realizacije -->
    <ng-container matColumnDef="realization_date">
      <th mat-header-cell mat-sort-header *matHeaderCellDef>Date of realization</th>
      <td mat-cell *matCellDef="let row">{{ row.realization_date | date:'dd.MM.yyyy' }}</td>
    </ng-container>

    <!-- Hotel -->
    <ng-container matColumnDef="hotel">
      <th mat-header-cell mat-sort-header *matHeaderCellDef>Hotel</th>
      <td mat-cell *matCellDef="let row">{{ row.hotel?.name }}</td>
    </ng-container>

    <!-- Action Buttons -->
    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef>
        <button mat-icon-button (click)="openDialog(1)">
          <mat-icon color="accent">add</mat-icon>
        </button>
      </th>
      <td mat-cell *matCellDef="let row; let i = index">
        <button mat-icon-button (click)="openDialog(2, row.id, row.ukupna_cena, row.placeno, row.datum_realizacije, row.hotel)">
          <mat-icon color="primary" aria-label="Edit">edit</mat-icon>
        </button>
        <button mat-icon-button (click)="openDialog(3, row.id, row.ukupna_cena, row.placeno, row.datum_realizacije, row.hotel)">
          <mat-icon color="warn" aria-label="Delete">delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <!-- Rows -->
    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>

  <mat-paginator [pageSizeOptions]="[5, 10, 20]" showFirstLastButtons aria-label="Select page"></mat-paginator>
</div>
