<mat-toolbar color="primary">
  <span class="title-center">Destinations</span>
</mat-toolbar>

<div class="container mat-elavation-z8">
  <table mat-table matSort [dataSource]="dataSource" class="mat-cell">
    <!-- ID -->
    <ng-container matColumnDef="id">
      <th mat-header-cell mat-sort-header *matHeaderCellDef>ID</th>
      <td mat-cell *matCellDef="let row">{{ row.id }}</td>
    </ng-container>

    <!-- Mesto -->
    <ng-container matColumnDef="place">
      <th mat-header-cell mat-sort-header *matHeaderCellDef>Place</th>
      <td mat-cell *matCellDef="let row">{{ row.place }}</td>
    </ng-container>

    <!-- Država -->
    <ng-container matColumnDef="country">
      <th mat-header-cell mat-sort-header *matHeaderCellDef>Country</th>
      <td mat-cell *matCellDef="let row">{{ row.country }}</td>
    </ng-container>

    <!-- Opis -->
    <ng-container matColumnDef="opis">
      <th mat-header-cell mat-sort-header *matHeaderCellDef>Description</th>
      <td mat-cell *matCellDef="let row">{{ row.description }}</td>
    </ng-container>

    <!-- Action Buttons -->
    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef>
        <button mat-icon-button (click)="openDialog(1)">
          <mat-icon color="accent">add</mat-icon>
        </button>
      </th>
      <td mat-cell *matCellDef="let row; let i = index">
        <button mat-icon-button (click)="openDialog(2, row.id, row.place, row.country, row.description)">
          <mat-icon color="primary" aria-label="Edit">edit</mat-icon>
        </button>
        <button mat-icon-button (click)="openDialog(3, row.id, row.place, row.country, row.description)">
          <mat-icon color="warn" aria-label="Delete">delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <!-- Rows -->
    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>

  <mat-paginator [pageSizeOptions]="[5, 10, 20]" showFirstLastButtons aria-label="Select page"></mat-paginator>
</div>
