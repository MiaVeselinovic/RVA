<mat-toolbar color="primary">
  <span class="title-center">Hotels</span>
</mat-toolbar>

<div class="container mat-elavation-z8">
  <table mat-table matSort [dataSource]="dataSource" class="mat-cell">
    <!-- ID -->
    <ng-container matColumnDef="id">
      <th mat-header-cell mat-sort-header *matHeaderCellDef>ID</th>
      <td mat-cell *matCellDef="let row">{{ row.id }}</td>
    </ng-container>

    <!-- Naziv -->
    <ng-container matColumnDef="name">
      <th mat-header-cell mat-sort-header *matHeaderCellDef>Name</th>
      <td mat-cell *matCellDef="let row">{{ row.naziv }}</td>
    </ng-container>

    <!-- Broj zvezdica -->
    <ng-container matColumnDef="numberOfStars">
      <th mat-header-cell mat-sort-header *matHeaderCellDef>Number of stars</th>
      <td mat-cell *matCellDef="let row">{{ row.numberOfStars }}</td>
    </ng-container>

    <!-- Opis -->
    <ng-container matColumnDef="description">
      <th mat-header-cell mat-sort-header *matHeaderCellDef>Description</th>
      <td mat-cell *matCellDef="let row">{{ row.description }}</td>
    </ng-container>

    <!-- Destinacija -->
    <ng-container matColumnDef="destination">
      <th mat-header-cell mat-sort-header *matHeaderCellDef>Destination</th>
      <td mat-cell *matCellDef="let row">{{ row.destination?.place }}</td>
    </ng-container>

    <!-- Action Buttons -->
    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef>
        <button mat-icon-button (click)="openDialog(1)">
          <mat-icon color="accent">add</mat-icon>
        </button>
      </th>
      <td mat-cell *matCellDef="let row; let i = index">
        <button
          mat-icon-button
          (click)="openDialog(2, row.id, row.name, row.numberOfStars, row.description, row.destination)"
        >
          <mat-icon color="primary" aria-label="Edit">edit</mat-icon>
        </button>
        <button
          mat-icon-button
          (click)="openDialog(3, row.id, row.name, row.numberOfStars, row.description, row.destinations)"
        >
          <mat-icon color="warn" aria-label="Delete">delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <!-- Rows -->
    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>
  <mat-paginator [pageSizeOptions]="[5, 10, 20]" showFirstLastButtons aria-label="Select page"></mat-paginator>
</div>
